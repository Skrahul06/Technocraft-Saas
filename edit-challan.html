<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Technocraft - Edit Entry</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
    
    <style>
        body { font-family: 'Hanken Grotesk', sans-serif; -webkit-font-smoothing: antialiased; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle;}
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e4e2e4; border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; }

        @media (max-width: 1023px) {
            .sidebar-open #sidebar-wrapper { transform: translateX(0); }
            .sidebar-open #sidebar-overlay { opacity: 1; visibility: visible; }
        }

        .dark input:-webkit-autofill,
        .dark input:-webkit-autofill:hover, 
        .dark input:-webkit-autofill:focus, 
        .dark input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 40px #0f0f11 inset !important;
            -webkit-text-fill-color: #f3f4f6 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: { primary: "#4c5b71" } } }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-[#0f0f11] text-gray-900 dark:text-gray-100 font-sans overflow-x-hidden transition-colors duration-300">
    
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm opacity-0 invisible transition-all duration-300 z-40 lg:hidden"></div>

    <div id="sidebar-wrapper" class="fixed top-0 bottom-0 left-0 w-[280px] h-screen bg-white dark:bg-[#1a1a1e] z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out border-r border-gray-200/50 dark:border-gray-800 shadow-2xl lg:shadow-none">
        <div id="sidebar-container" class="h-full w-full"></div>
    </div>

    <div class="min-h-screen flex flex-col lg:pl-[280px] w-full transition-all duration-300">
        
        

        <main class="flex-1 p-4 md:p-8 w-full max-w-[100vw]">
            <div class="max-w-4xl mx-auto">
                
                <div class="hidden lg:flex items-center justify-between mb-8">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100 tracking-tight">Edit Entry Ledger</h1>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Modify transaction records and balance stock allocations.</p>
                    </div>
                    <button onclick="window.history.back()" class="flex items-center gap-2 text-sm font-semibold text-gray-600 dark:text-gray-400 hover:text-primary dark:hover:text-blue-400 transition-colors">
                        <span class="material-symbols-outlined text-lg">arrow_back</span> Back
                    </button>
                </div>

                <form id="challanForm" class="space-y-5 md:space-y-8 pb-10">
                    
                    <section class="bg-white dark:bg-[#1a1a1e] p-5 md:p-8 rounded-[1.5rem] shadow-sm dark:shadow-none border border-gray-200 dark:border-gray-800 transition-colors">
                        <h2 class="text-[11px] font-bold uppercase text-gray-400 dark:text-gray-500 tracking-widest mb-5 md:mb-6">1. Operation Context</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-6">
                            <div class="flex flex-col gap-1.5">
                                <label class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Operation Type</label>
                                <select id="type" required class="w-full h-[48px] px-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50 outline-none transition-colors cursor-pointer leading-normal">
                                    <option value="Out">Customer Outbound (Sales)</option>
                                    <option value="In">Vendor Inbound (Purchase)</option>
                                </select>
                            </div>
                            <div class="flex flex-col gap-1.5">
                                <label class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Issue Date</label>
                                <input type="date" id="date" required style="color-scheme: light dark;" class="w-full h-[48px] px-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50 outline-none transition-colors leading-normal">
                            </div>
                            <div class="flex flex-col gap-1.5">
                                <label class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Challan #</label>
                                <input type="text" id="challan_number" disabled class="w-full h-[48px] px-4 bg-gray-100 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 text-gray-500 dark:text-gray-600 rounded-xl text-sm cursor-not-allowed transition-colors leading-normal">
                            </div>
                            <div class="flex flex-col gap-1.5">
                                <label class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Reference Order / PO</label>
                                <input type="text" id="order_id" class="w-full h-[48px] px-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50 outline-none transition-colors leading-normal">
                            </div>
                        </div>
                    </section>

                    <section class="bg-white dark:bg-[#1a1a1e] p-5 md:p-8 rounded-[1.5rem] shadow-sm dark:shadow-none border border-gray-200 dark:border-gray-800 transition-colors">
                        <h2 class="text-[11px] font-bold uppercase text-gray-400 dark:text-gray-500 tracking-widest mb-5 md:mb-6">2. Billing Entity Details</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="flex flex-col gap-1.5">
                                <label class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Entity Name <span class="text-error">*</span></label>
                                <input type="text" id="party_name" required class="w-full h-[48px] px-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50 outline-none transition-colors leading-normal">
                            </div>
                            <div class="flex flex-col gap-1.5">
                                <label class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">GST Number (Optional)</label>
                                <input type="text" id="party_gst" placeholder="GSTIN" class="w-full h-[48px] px-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50 outline-none transition-colors leading-normal">
                            </div>
                            <div class="flex flex-col gap-1.5 md:col-span-2">
                                <label class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Payment Terms (Credit Period)</label>
                                <select id="payment_terms" class="w-full h-[48px] px-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50 outline-none transition-colors cursor-pointer leading-normal">
                                    <option value="Immediate">Immediate / Advance</option>
                                    <option value="15 Days">Net 15 Days</option>
                                    <option value="30 Days">Net 30 Days</option>
                                    <option value="45 Days">Net 45 Days</option>
                                    <option value="60 Days">Net 60 Days</option>
                                    <option value="90 Days">Net 90 Days</option>
                                </select>
                            </div>
                            <div class="flex flex-col gap-3">
                                <div class="flex items-center justify-between">
                                    <label class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Phone Numbers</label>
                                    <button type="button" class="add-phone-btn text-xs font-bold text-primary dark:text-blue-400 hover:text-blue-600 transition-colors">+ Add Phone</button>
                                </div>
                                <div id="phone-container" class="flex flex-col gap-2"></div>
                            </div>
                            <div class="flex flex-col gap-3">
                                <div class="flex items-center justify-between">
                                    <label class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Email Addresses</label>
                                    <button type="button" class="add-email-btn text-xs font-bold text-primary dark:text-blue-400 hover:text-blue-600 transition-colors">+ Add Email</button>
                                </div>
                                <div id="email-container" class="flex flex-col gap-2"></div>
                            </div>
                        </div>
                    </section>

                    <section class="bg-white dark:bg-[#1a1a1e] p-5 md:p-8 rounded-[1.5rem] shadow-sm dark:shadow-none border border-gray-200 dark:border-gray-800 transition-colors">
                        <h2 class="text-[11px] font-bold uppercase text-gray-400 dark:text-gray-500 tracking-widest mb-5 md:mb-6">3. Transit & Logistics</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 md:gap-6">
                            <div class="flex flex-col gap-1.5">
                                <label class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Logistics Status</label>
                                <select id="logistics_status" class="w-full h-[48px] px-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50 outline-none transition-colors cursor-pointer leading-normal">
                                    <option value="Processing">Processing</option>
                                    <option value="Dispatched">Dispatched / In Transit</option>
                                    <option value="Delivered">Delivered</option>
                                </select>
                            </div>
                            <div class="flex flex-col gap-1.5">
                                <label class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Transporter / Courier</label>
                                <input type="text" id="transporter" placeholder="e.g. Blue Dart, Self" class="w-full h-[48px] px-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50 outline-none transition-colors leading-normal">
                            </div>
                            <div class="flex flex-col gap-1.5">
                                <label class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Vehicle Number</label>
                                <input type="text" id="vehicle_number" placeholder="e.g. WB-11-C-9988" class="w-full h-[48px] px-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm uppercase focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50 outline-none transition-colors leading-normal">
                            </div>
                            <div class="flex flex-col gap-1.5">
                                <label class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">LR / Tracking Number</label>
                                <input type="text" id="lr_number" placeholder="Lorry Receipt No." class="w-full h-[48px] px-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50 outline-none transition-colors leading-normal">
                            </div>
                            <div class="flex flex-col gap-1.5 md:col-span-2">
                                <label class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">E-Way Bill Number</label>
                                <input type="text" id="eway_bill" placeholder="12-digit E-Way Bill Number" class="w-full h-[48px] px-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50 outline-none transition-colors leading-normal">
                            </div>
                        </div>
                    </section>

                    <section class="bg-white dark:bg-[#1a1a1e] p-5 md:p-8 rounded-[1.5rem] shadow-sm dark:shadow-none border border-gray-200 dark:border-gray-800 transition-colors flex flex-col w-full overflow-hidden">
                        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-4 md:mb-6">
                            <h2 class="text-[11px] font-bold uppercase text-gray-400 dark:text-gray-500 tracking-widest">4. Inventory Logs</h2>
                            <button type="button" id="addRowBtn" class="w-full sm:w-auto flex items-center justify-center gap-1.5 text-[11px] font-bold text-primary dark:text-blue-400 hover:bg-gray-100 dark:hover:bg-gray-800 bg-gray-50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 px-3 py-1.5 rounded-lg transition-all active:scale-95 uppercase tracking-wider">
                                <span class="material-symbols-outlined text-[14px] font-bold">add</span> Add Row
                            </button>
                        </div>
                        
                        <div class="overflow-x-auto w-full custom-scrollbar border border-gray-200 dark:border-gray-800 rounded-2xl transition-colors pb-2" style="-webkit-overflow-scrolling: touch;">
                            <table class="w-full text-left min-w-[800px]">
                                <thead class="bg-gray-50 dark:bg-[#222226] border-b border-gray-200 dark:border-gray-800 transition-colors">
                                    <tr class="text-[10px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">
                                        <th class="p-4 w-[35%] min-w-[200px]">Product Description SKU</th>
                                        <th class="p-4 w-[15%] min-w-[100px]">HSN/SAC</th>
                                        <th class="p-4 w-[15%] min-w-[100px]">Quantity</th>
                                        <th class="p-4 w-[15%] min-w-[120px]">Unit</th>
                                        <th class="p-4 w-[15%] min-w-[120px]">Unit Price</th>
                                        <th class="p-4 w-12 text-center"></th>
                                    </tr>
                                </thead>
                                <tbody id="itemsBody" class="divide-y divide-gray-100 dark:divide-gray-800/50"></tbody>
                            </table>
                        </div>
                    </section>

                    <section class="bg-white dark:bg-[#1a1a1e] p-5 md:p-8 rounded-[1.5rem] shadow-sm dark:shadow-none border border-gray-200 dark:border-gray-800 transition-colors">
                        <h2 class="text-[11px] font-bold uppercase text-gray-400 dark:text-gray-500 tracking-widest mb-4">5. Remarks & Notes</h2>
                        <textarea id="remarks" rows="3" placeholder="Enter delivery instructions, transit notes, or exception remarks..." class="w-full p-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50 outline-none transition-colors resize-none"></textarea>
                    </section>

                    <div class="flex pt-2">
                        <button type="submit" id="submitBtn" class="w-full sm:w-auto sm:ml-auto bg-primary dark:bg-blue-600 text-white font-bold px-10 py-4 md:py-3.5 rounded-2xl shadow-md dark:shadow-none hover:bg-slate-800 dark:hover:bg-blue-500 transition-all active:scale-95 text-center flex justify-center items-center text-sm tracking-wide gap-2">
                            <span class="material-symbols-outlined text-[18px]">save</span> Update Entry
                        </button>
                    </div>
                </form>
            </div>
        </main>
        
        <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-3"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuToggleBtn = document.getElementById('mobile-menu-toggle');
            const sideOverlay = document.getElementById('sidebar-overlay');
            const rootHtml = document.documentElement;

            const toggleSidebarState = () => rootHtml.classList.toggle('sidebar-open');

            if (menuToggleBtn && sideOverlay) {
                menuToggleBtn.addEventListener('click', toggleSidebarState);
                sideOverlay.addEventListener('click', toggleSidebarState);
            }
        });
    </script>
    <script type="module" src="js/editentry.js"></script>
</body>
</html>
