<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technocraft - Edit Entry Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
     <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#505f76", "inverse-primary": "#b7c8e1", "on-tertiary-fixed": "#2a1801",
                        "surface-variant": "#e4e2e4", "surface": "#fbf9fa", "on-tertiary-container": "#fff9f5",
                        "secondary-container": "#d2e1f7", "on-primary-container": "#f9f9ff", "on-primary-fixed": "#0b1c30",
                        "on-primary-fixed-variant": "#38485d", "surface-dim": "#dbd9db", "inverse-on-surface": "#f2f0f2",
                        "on-secondary-fixed-variant": "#39485a", "secondary-fixed": "#d4e4fa", "on-tertiary": "#ffffff",
                        "secondary": "#516072", "tertiary-container": "#8a6e4c", "surface-bright": "#fbf9fa",
                        "secondary-fixed-dim": "#b9c8de", "on-surface-variant": "#44474c", "on-background": "#1b1b1d",
                        "on-secondary-container": "#556477", "surface-container-lowest": "#ffffff", "inverse-surface": "#303032",
                        "on-error-container": "#93000a", "on-tertiary-fixed-variant": "#5a4224", "primary-fixed-dim": "#b7c8e1",
                        "tertiary-fixed-dim": "#e3c199", "primary-container": "#64748b", "error-container": "#ffdad6",
                        "on-surface": "#1b1b1d", "primary-fixed": "#d3e4fe", "surface-container-low": "#f5f3f5",
                        "on-primary": "#ffffff", "outline": "#74777d", "on-secondary": "#ffffff", "outline-variant": "#c4c6cd",
                        "tertiary": "#6f5636", "on-error": "#ffffff", "on-secondary-fixed": "#0d1c2d",
                        "surface-container-highest": "#e4e2e4", "error": "#ba1a1a", "background": "#fbf9fa",
                        "tertiary-fixed": "#ffddb6", "primary": "#4c5b71", "surface-container": "#efedef"
                    },
                    "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                    "spacing": { "margin-mobile": "16px", "lg": "2rem", "base": "4px", "md": "1.5rem", "gutter": "24px", "margin-desktop": "32px", "xs": "0.5rem", "xl": "3rem", "sm": "1rem" },
                    "fontFamily": {
                        "label-md": ["Hanken Grotesk"], "code-sm": ["jetbrainsMono"], "body-md": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"], "body-lg": ["Hanken Grotesk"], "headline-lg": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                        "code-sm": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans text-gray-900 antialiased">

    <div class="flex min-h-screen">
        <div id="sidebar-container" class="w-64 bg-white border-r border-gray-200 flex flex-col justify-between"></div>

        <main class="flex-1 p-8">
            <div class="flex items-center justify-between mb-8 border-b border-gray-100 pb-4">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800 tracking-tight">Edit Entry Ledger</h1>
                    <p class="text-sm text-gray-500 mt-1">Modify transaction records, change payment statuses, and balance active warehouse stock allocations.</p>
                </div>
                <a href="challan.html" class="flex items-center gap-2 text-sm font-semibold text-gray-600 hover:text-primary transition-colors">
                    <span class="material-symbols-outlined text-lg">arrow_back</span>
                    Back to Hub
                </a>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 max-w-5xl mx-auto">
                <form id="challanForm" class="space-y-6">
                    
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <div class="flex flex-col gap-1.5">
                            <label for="party_name" class="text-xs font-bold uppercase tracking-wider text-gray-500">Party / Billed Entity</label>
                            <input type="text" id="party_name" required placeholder="Enter customer or vendor name"
                                class="w-full px-3 py-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none">
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label for="type" class="text-xs font-bold uppercase tracking-wider text-gray-500">Transaction Type</label>
                            <select id="type" required 
                                class="w-full px-3 py-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none">
                                <option value="Out">Out (Sales / Dispatch)</option>
                                <option value="In">In (Procurement / Stock In)</option>
                                <option value="Sales Return">Sales Return</option>
                                <option value="Purchase Return">Purchase Return</option>
                            </select>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label for="status" class="text-xs font-bold uppercase tracking-wider text-gray-500">Payment Status</label>
                            <select id="status" required 
                                class="w-full px-3 py-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none">
                                <option value="Pending">Pending</option>
                                <option value="Paid">Paid</option>
                            </select>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label for="date" class="text-xs font-bold uppercase tracking-wider text-gray-500">Transaction Date</label>
                            <input type="date" id="date" required
                                class="w-full px-3 py-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none">
                        </div>
                    </div>

                    <hr class="border-gray-100">

                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <h3 class="text-sm font-bold uppercase tracking-wider text-gray-700">Allocated Component Line Items</h3>
                            <button type="button" id="addRowBtn" 
                                class="flex items-center gap-1.5 text-xs font-bold text-primary hover:text-slate-800 bg-surface-container-low px-3 py-1.5 rounded-lg transition-all active:scale-95">
                                <span class="material-symbols-outlined text-sm font-bold">add</span>
                                Add Row Item
                            </button>
                        </div>

                        <div class="overflow-x-auto border border-gray-200 rounded-xl">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-gray-50 border-b border-gray-200 text-xs font-bold uppercase tracking-wider text-gray-500">
                                        <th class="p-3 w-1/2">Product Description SKU</th>
                                        <th class="p-3 w-1/4">Quantity</th>
                                        <th class="p-3 w-1/4">Unit Price (Rate)</th>
                                        <th class="p-3 text-center w-12">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="itemsBody" class="divide-y divide-gray-100 bg-white"></tbody>
                            </table>
                        </div>
                    </div>

                    <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100">
                        <a href="challan.html" 
                            class="px-5 py-2.5 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-xl transition-all active:scale-95">
                            Cancel Changes
                        </a>
                        <button type="submit" id="submitBtn" 
                            class="flex items-center gap-2 bg-primary hover:bg-slate-700 text-white font-bold px-6 py-2.5 rounded-xl shadow-md shadow-primary/10 transition-all transform active:scale-95">
                            <span class="material-symbols-outlined text-base">save</span>
                            Update Entry
                        </button>
                    </div>

                </form>
            </div>
        </main>
    </div>

    <script type="module" src="js/editentry.js"></script>
</body>
</html>
