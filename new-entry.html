<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Technocraft - Entry Form</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        body { font-family: 'Hanken Grotesk', sans-serif; -webkit-font-smoothing: antialiased; }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#505f76", "inverse-primary": "#b7c8e1", "on-tertiary-fixed": "#2a1801",
                        "surface-variant": "#e4e2e4", "surface": "#fbf9fa", "on-tertiary-container": "#fff9f5",
                        "secondary-container": "#d2e1f7", "on-primary-container": "#f9f9ff", "on-primary-fixed": "#0b1c30",
                        "on-primary-fixed-variant": "#38485d", "surface-dim": "#dbd9db", "inverse-on-surface": "#f2f0f2",
                        "on-secondary-fixed-variant": "#39485a", "secondary-fixed": "#d4e4fa", "on-tertiary": "#ffffff",
                        "secondary": "#516072", "tertiary-container": "#8a6e4c", "surface-bright": "#fbf9fa",
                        "secondary-fixed-dim": "#b9c8de", "on-surface-variant": "#44474c", "on-background": "#1b1b1d",
                        "on-secondary-container": "#556477", "surface-container-lowest": "#ffffff", "inverse-surface": "#303032",
                        "on-error-container": "#93000a", "on-tertiary-fixed-variant": "#5a4224", "primary-fixed-dim": "#b7c8e1",
                        "tertiary-fixed-dim": "#e3c199", "primary-container": "#64748b", "error-container": "#ffdad6",
                        "on-surface": "#1b1b1d", "primary-fixed": "#d3e4fe", "surface-container-low": "#f5f3f5",
                        "on-primary": "#ffffff", "outline": "#74777d", "on-secondary": "#ffffff", "outline-variant": "#c4c6cd",
                        "tertiary": "#6f5636", "on-error": "#ffffff", "on-secondary-fixed": "#0d1c2d",
                        "surface-container-highest": "#e4e2e4", "error": "#ba1a1a", "background": "#fbf9fa",
                        "tertiary-fixed": "#ffddb6", "primary": "#4c5b71", "surface-container": "#efedef"
                    },
                    "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                    "spacing": { "margin-mobile": "16px", "lg": "2rem", "base": "4px", "md": "1.5rem", "gutter": "24px", "margin-desktop": "32px", "xs": "0.5rem", "xl": "3rem", "sm": "1rem" },
                    "fontFamily": {
                        "label-md": ["Hanken Grotesk"], "code-sm": ["jetbrainsMono"], "body-md": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"], "body-lg": ["Hanken Grotesk"], "headline-lg": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                        "code-sm": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background relative">

    <div id="sidebar-container"></div>

    <header class="h-16 sticky top-0 z-40 ml-[280px] bg-background/90 backdrop-blur-md flex justify-between items-center px-margin-desktop w-[calc(100%-280px)] border-b border-surface-container-low transition-all">
        <div class="flex items-center w-1/3">
            <button onclick="window.history.back()" class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors font-semibold text-sm">
                <span class="material-symbols-outlined text-[18px]">arrow_back</span> Back
            </button>
        </div>
        <h2 class="absolute left-1/2 -translate-x-1/2 font-headline-md text-xl font-bold text-on-surface whitespace-nowrap" id="header-title">New Entry</h2>
        <div class="flex items-center justify-end w-1/3 gap-4">
            <div class="h-10 w-10 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden border border-surface-dim">
                <img alt="Manager Avatar" class="h-full w-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAUVVNY6j7Epofems6gnzxGIqPtIh7L84Mmo2KGXgI5pN0ay7N8KorHhNDtLcDkJ_hrg53GGHYD1aS1pALgQgn-w0LUV1FmN3pByIwaoYndPJXYMIj6cf7dZACPDDXsIeMfYYvc4W_E-j0pjYoOyrO1oOeHak_6uJx-OHMA-ssh-4VCl8pSX9UbpFbFfssOrrZZGYVf97CyFHckA-VLQPWUWsAEzzyMNUoZcJ506_N8pATIjH9JvPHN1jMkkgPhooG7Y7YgJ5CUdymp"/>
            </div>
        </div>
    </header>

    <main class="ml-[280px] p-margin-desktop min-h-screen">
       <div class="max-w-4xl mx-auto">
            
            <div class="mb-8">
                <h3 class="text-2xl font-bold text-on-surface" id="page-title">Create New Challan</h3>
                <p class="text-sm text-on-surface-variant mt-1">Fill out the operation details below to register it in the database.</p>
            </div>

            <form id="entry-form" class="bg-surface-container-lowest rounded-2xl border border-surface-dim shadow-sm p-8 space-y-6">
                
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-on-surface-variant mb-2">Billed Entity / Party Name</label>
                        <input type="text" id="party_name" required class="w-full bg-surface-container-low border border-surface-dim rounded-lg py-3 px-4 text-sm focus:ring-2 focus:ring-primary focus:bg-white transition-all outline-none" placeholder="e.g. Apex Retailers">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-bold text-on-surface-variant mb-2">Operation Type</label>
                        <select id="type" required class="w-full bg-surface-container-low border border-surface-dim rounded-lg py-3 px-4 text-sm focus:ring-2 focus:ring-primary focus:bg-white transition-all outline-none">
                            <option value="Out">Customer Outbound (Sales)</option>
                            <option value="In">Vendor Inbound (Purchase)</option>
                            <option value="Sales Return">Sales Return</option>
                            <option value="Purchase Return">Purchase Return</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-6 border-t border-surface-container-low pt-6">
                    <div>
                        <label class="block text-sm font-bold text-on-surface-variant mb-2">Item Allocation</label>
                        <select id="entry-product-select" required class="w-full bg-surface-container-low border border-surface-dim rounded-lg py-3 px-4 text-sm focus:ring-2 focus:ring-primary focus:bg-white transition-all outline-none">
                            <option value="">Choose item component link...</option>
                            <option value="1">Industrial Control Panel Enclosure (SKU-ELEC-042)</option>
                            <option value="2">High-Tensile Steel Bolts (M12) (SKU-MECH-001)</option>
                            <option value="3">Pneumatic Air Pressure Regulator (SKU-PNEU-089)</option>
                            <option value="4">Heavy-Duty Nitrile Protective Gloves (SKU-SFTY-112)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-on-surface-variant mb-2">Operation Movement Quantity</label>
                        <input type="number" id="entry-product-qty" min="1" value="1" required class="w-full bg-surface-container-low border border-surface-dim rounded-lg py-3 px-4 text-sm focus:ring-2 focus:ring-primary focus:bg-white transition-all outline-none" placeholder="Units volume amount">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-6 border-t border-surface-container-low pt-6">
                    <div>
                        <label class="block text-sm font-bold text-on-surface-variant mb-2">Net Amount (USD)</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-bold">$</span>
                            <input type="number" id="total_amount" step="0.01" required class="w-full bg-surface-container-low border border-surface-dim rounded-lg py-3 pl-8 pr-4 text-sm focus:ring-2 focus:ring-primary focus:bg-white transition-all outline-none" placeholder="0.00">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-on-surface-variant mb-2">Payment Status</label>
                        <select id="status" required class="w-full bg-surface-container-low border border-surface-dim rounded-lg py-3 px-4 text-sm focus:ring-2 focus:ring-primary focus:bg-white transition-all outline-none">
                            <option value="Pending">Pending</option>
                            <option value="Paid">Paid</option>
                        </select>
                    </div>
                </div>

                <div class="pt-6 mt-6 border-t border-surface-container-low flex justify-end gap-3">
                    <button type="button" onclick="window.history.back()" class="px-6 py-3 rounded-lg font-bold text-on-surface-variant hover:bg-surface-container-low transition-colors">Cancel</button>
                    <button type="submit" id="submit-btn" class="px-8 py-3 bg-primary text-white font-bold rounded-lg hover:bg-primary/90 transition-colors shadow-sm flex items-center gap-2">
                        <span class="material-symbols-outlined text-[18px]">save</span> <span id="btn-text">Save Entry</span>
                    </button>
                </div>
            </form>

        </div>
    </main>

    <script type="module" src="./js/newentry.js"></script>
</body>
</html>
