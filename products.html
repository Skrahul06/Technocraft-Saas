<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Products & Inventory Ledger | Technocraft</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Hanken Grotesk', sans-serif; -webkit-font-smoothing: antialiased; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
        .monospace { font-family: 'JetBrains Mono', 'Courier New', monospace; letter-spacing: -0.02em; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e4e2e4; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #d2e1f7; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #52525b; }

        @media (max-width: 1023px) {
            .sidebar-open #sidebar-wrapper { transform: translateX(0); }
            .sidebar-open #sidebar-overlay { opacity: 1; visibility: visible; }
        }
    </style>

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: { colors: { primary: "#4c5b71" } }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-[#0f0f11] text-gray-900 dark:text-gray-100 font-sans overflow-x-hidden flex transition-colors duration-300">

    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm opacity-0 invisible transition-all duration-300 z-40 lg:hidden"></div>
    <div id="sidebar-wrapper" class="fixed top-0 bottom-0 left-0 w-[280px] h-screen bg-white dark:bg-[#1a1a1e] z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out border-r border-gray-200/50 dark:border-gray-800 shadow-2xl lg:shadow-none">
        <div id="sidebar-container" class="h-full w-full"></div>
    </div>

    <main class="flex-1 min-w-0 ml-0 lg:ml-[280px] h-screen overflow-y-auto relative transition-all duration-300 w-full custom-scrollbar bg-[#f1f3f6] dark:bg-[#0f0f11]">
        
        <header class="h-16 sticky top-0 z-40 bg-white/90 dark:bg-[#0f0f11]/90 backdrop-blur-md flex items-center justify-between px-4 lg:px-8 border-b border-gray-200/60 dark:border-gray-800 transition-colors">
            
            <div class="flex items-center gap-2 md:gap-3 shrink-0 z-10 w-[60%] sm:w-auto">
                <button id="mobile-menu-toggle" class="material-symbols-outlined text-gray-500 dark:text-gray-400 p-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full lg:hidden transition-colors cursor-pointer focus:outline-none shrink-0">
                    menu
                </button>
                <h2 class="font-bold text-base md:text-lg lg:text-xl text-gray-900 dark:text-gray-100 whitespace-nowrap truncate">
                    Products & Inventory
                </h2>
            </div>
            
            <div class="relative flex items-center justify-end flex-grow h-full gap-1 sm:gap-2 lg:gap-4 z-40">
                <div class="group flex items-center justify-end z-50 transition-all duration-300 ease-in-out w-10 h-10 md:w-[240px] focus-within:absolute focus-within:right-0 focus-within:w-[calc(100vw-80px)] sm:focus-within:w-[calc(100vw-120px)] md:focus-within:relative md:focus-within:w-[320px] lg:focus-within:w-[450px]">
                    <div class="w-full h-full rounded-full bg-transparent hover:bg-gray-50 dark:hover:bg-gray-800 md:bg-gray-50 md:dark:bg-[#1a1a1e] group-focus-within:bg-white dark:group-focus-within:bg-[#1a1a1e] border border-transparent group-focus-within:border-primary dark:group-focus-within:border-blue-500 group-focus-within:ring-2 group-focus-within:ring-primary/20 dark:group-focus-within:ring-blue-500/20 transition-all duration-300 flex items-center relative overflow-hidden shadow-none group-focus-within:shadow-md md:group-focus-within:shadow-none">
                        <label for="searchInput" class="material-symbols-outlined flex-shrink-0 ml-2 md:ml-3 text-gray-400 group-focus-within:text-primary dark:group-focus-within:text-blue-500 cursor-pointer text-[20px] p-1">search</label>
                        <input id="searchInput" type="text" placeholder="Search SKU or Designation..." class="w-full h-full bg-transparent border-none outline-none pl-2 pr-10 text-sm text-gray-900 dark:text-gray-100 placeholder-transparent md:placeholder-gray-500 dark:md:placeholder-gray-400 group-focus-within:placeholder-gray-500 dark:group-focus-within:placeholder-gray-400 cursor-pointer md:cursor-text group-focus-within:cursor-text opacity-0 group-focus-within:opacity-100 md:opacity-100 transition-opacity">
                        <button type="button" onclick="document.getElementById('searchInput').blur(); document.getElementById('searchInput').value=''; document.getElementById('searchInput').dispatchEvent(new Event('input'));" class="material-symbols-outlined absolute right-2 text-gray-400 hover:text-red-500 dark:hover:text-red-400 text-[18px] opacity-0 invisible group-focus-within:opacity-100 group-focus-within:visible transition-all cursor-pointer p-1">close</button>
                    </div>
                </div>

                <div class="h-6 w-px bg-gray-200 dark:bg-gray-700 hidden lg:block shrink-0"></div>

                <div class="flex items-center gap-1 sm:gap-2 shrink-0 transition-opacity duration-200">
                    <button class="material-symbols-outlined text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-blue-400 hover:bg-gray-100 dark:hover:bg-gray-800 p-1.5 rounded-full transition-all cursor-pointer hidden lg:flex items-center justify-center">help_outline</button>
                    
                    <div class="relative flex items-center shrink-0">
                        <button id="notif-btn" class="material-symbols-outlined text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-blue-400 p-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full transition-all cursor-pointer relative flex items-center justify-center">
                            notifications
                            <span class="absolute top-[4px] right-[4px] w-2 h-2 bg-[#e2726e] rounded-full border-[1.5px] border-white dark:border-[#0f0f11]"></span>
                        </button>
                        <div id="notif-dropdown" class="absolute right-0 mt-3 top-full w-64 sm:w-72 bg-white dark:bg-[#1a1a1e] border border-gray-200 dark:border-gray-800 rounded-xl shadow-lg opacity-0 invisible translate-y-2 transition-all duration-300 z-50">
                            <div class="p-4 border-b border-gray-100 dark:border-gray-800 font-bold text-gray-900 dark:text-gray-100 flex justify-between items-center text-sm">
                                Notifications <span class="text-[10px] bg-primary/10 dark:bg-blue-500/20 text-primary dark:text-blue-400 px-2 py-0.5 rounded-full">1 New</span>
                            </div>
                        </div>
                    </div>

                    <div class="relative flex items-center shrink-0">
                        <button id="theme-toggle" class="material-symbols-outlined text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-blue-400 hover:bg-gray-100 dark:hover:bg-gray-800 p-1.5 rounded-full transition-all cursor-pointer flex items-center justify-center">light_mode</button>
                    </div>

                    <div class="relative flex items-center shrink-0 ml-1">
                        <button id="profile-btn" class="h-8 w-8 md:h-9 md:w-9 rounded-full bg-blue-50 dark:bg-blue-900/30 flex items-center justify-center overflow-hidden border border-gray-200 dark:border-gray-700 hover:border-primary dark:hover:border-blue-400 transition-all focus:outline-none shrink-0">
                            <img alt="Manager Avatar" class="h-full w-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAUVVNY6j7Epofems6gnzxGIqPtIh7L84Mmo2KGXgI5pN0ay7N8KorHhNDtLcDkJ_hrg53GGHYD1aS1pALgQgn-w0LUV1FmN3pByIwaoYndPJXYMIj6cf7dZACPDDXsIeMfYYvc4W_E-j0pjYoOyrO1oOeHak_6uJx-OHMA-ssh-4VCl8pSX9UbpFbFfssOrrZZGYVf97CyFHckA-VLQPWUWsAEzzyMNUoZcJ506_N8pATIjH9JvPHN1jMkkgPhooG7Y7YgJ5CUdymp"/>
                        </button>
                        <div id="profile-dropdown" class="absolute right-0 mt-3 top-full w-48 bg-white dark:bg-[#1a1a1e] border border-gray-200 dark:border-gray-800 rounded-xl shadow-lg opacity-0 invisible translate-y-2 transition-all duration-300 z-50 py-1">
                            <a href="#" class="flex items-center gap-2 px-4 py-2 text-sm text-red-500 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-500/10 transition-colors">
                                <span class="material-symbols-outlined text-[18px]">logout</span> Sign out
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="p-4 md:p-6 lg:p-8 max-w-7xl mx-auto space-y-6 lg:space-y-8">
            
            <section class="grid grid-cols-1 md:grid-cols-3 gap-4 lg:gap-6">
                <div class="bg-white dark:bg-[#1a1a1e] border border-gray-200 dark:border-gray-800 p-5 md:p-6 rounded-[1.5rem] flex items-start justify-between shadow-sm dark:shadow-none transition-colors">
                    <div>
                        <p class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1">Total Unique SKUs</p>
                        <h3 id="stat-total-skus" class="text-3xl font-bold text-primary dark:text-blue-400">0</h3>
                    </div>
                    <span class="material-symbols-outlined text-gray-300 dark:text-gray-700 text-4xl">list_alt</span>
                </div>
                <div class="bg-amber-50 dark:bg-amber-500/10 border border-amber-200 dark:border-amber-900/30 p-5 md:p-6 rounded-[1.5rem] flex items-start justify-between shadow-sm dark:shadow-none transition-colors">
                    <div>
                        <p class="text-xs font-bold text-amber-800 dark:text-amber-500 uppercase tracking-wider mb-1">Critical Alerts</p>
                        <h3 id="stat-low-alerts" class="text-3xl font-bold text-amber-900 dark:text-amber-400">0</h3>
                    </div>
                    <span class="material-symbols-outlined text-amber-500 text-4xl" style="font-variation-settings: 'FILL' 1;">warning</span>
                </div>
                <div class="bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-900/30 p-5 md:p-6 rounded-[1.5rem] flex items-start justify-between shadow-sm dark:shadow-none transition-colors">
                    <div>
                        <p class="text-xs font-bold text-red-800 dark:text-red-500 uppercase tracking-wider mb-1">Out of Stock</p>
                        <h3 id="stat-out-alerts" class="text-3xl font-bold text-red-900 dark:text-red-400">0</h3>
                    </div>
                    <span class="material-symbols-outlined text-red-500 text-4xl" style="font-variation-settings: 'FILL' 1;">error</span>
                </div>
            </section>

            <section class="flex flex-col sm:flex-row justify-start items-center gap-4">
                <button id="open-add-product-btn" class="w-full sm:w-auto bg-primary dark:bg-blue-600 text-white font-bold px-6 py-2.5 rounded-xl hover:bg-slate-800 dark:hover:bg-blue-500 transition-all shadow-md active:scale-95 flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-[18px]">add_circle</span> Add New SKU
                </button>
            </section>

            <section class="bg-white dark:bg-[#1a1a1e] border border-gray-200 dark:border-gray-800 rounded-[1.5rem] shadow-sm dark:shadow-none overflow-hidden flex flex-col w-full transition-colors pb-2">
                <div class="overflow-x-auto w-full custom-scrollbar" style="-webkit-overflow-scrolling: touch;">
                    <table class="w-full text-left border-collapse min-w-[700px]">
                        <thead class="bg-gray-50 dark:bg-[#222226] border-b border-gray-200 dark:border-gray-800 transition-colors">
                            <tr>
                                <th class="px-6 py-4 text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider whitespace-nowrap">SKU Code</th>
                                <th class="px-6 py-4 text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider whitespace-nowrap">Product Designation</th>
                                <th class="px-6 py-4 text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider whitespace-nowrap">Category</th>
                                <th class="px-6 py-4 text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider whitespace-nowrap text-right">Stock Balance</th>
                                <th class="px-6 py-4 text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider whitespace-nowrap text-right">Storage Loc.</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-table-body" class="divide-y divide-gray-100 dark:divide-gray-800/50 text-sm">
                        </tbody>
                    </table>
                </div>
                <div class="bg-gray-50 dark:bg-[#222226] px-6 py-4 border-t border-gray-200 dark:border-gray-800 flex items-center justify-between transition-colors">
                    <p id="table-entries-count-string" class="text-xs font-semibold text-gray-500 dark:text-gray-400">Connecting database log units...</p>
                </div>
            </section>
        </div>
    </main>

    <div id="add-product-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 dark:bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-[#1a1a1e] rounded-[1.5rem] shadow-2xl w-full max-w-2xl flex flex-col overflow-hidden relative transition-colors transform scale-95 transition-transform duration-300" id="add-product-card">
            
            <div class="p-5 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center bg-gray-50 dark:bg-[#222226]">
                <h3 class="text-lg font-bold text-gray-900 dark:text-gray-100 flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary dark:text-blue-400">inventory_2</span> Register New Product
                </h3>
                <button id="close-product-modal-btn" class="p-1.5 text-gray-500 dark:text-gray-400 hover:bg-red-50 dark:hover:bg-red-500/10 hover:text-red-500 dark:hover:text-red-400 rounded-full transition-colors">
                    <span class="material-symbols-outlined text-[20px]">close</span>
                </button>
            </div>

            <form id="add-product-form" class="p-6 space-y-4 overflow-y-auto max-h-[70vh] custom-scrollbar">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold uppercase text-gray-500 dark:text-gray-400">Product Name *</label>
                        <input type="text" id="new-prod-name" autocomplete="off" required class="h-[44px] px-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold uppercase text-gray-500 dark:text-gray-400">SKU Code *</label>
                        <input type="text" id="new-prod-sku" required placeholder="e.g. ELEC-001" autocomplete="off" class="h-[44px] px-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm uppercase outline-none focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold uppercase text-gray-500 dark:text-gray-400">Category</label>
                        <input type="text" id="new-prod-cat" list="category-list" autocomplete="off" placeholder="Select or type new..." class="h-[44px] px-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50">
                        <datalist id="category-list">
                            <!-- Injected via JS -->
                        </datalist>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold uppercase text-gray-500 dark:text-gray-400">HSN / SAC Code</label>
                        <input type="text" id="new-prod-hsn" autocomplete="off"class="h-[44px] px-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm font-mono outline-none focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold uppercase text-gray-500 dark:text-gray-400">Unit Price (₹)</label>
                        <input type="number" id="new-prod-price" step="0.01" min="0" required class="h-[44px] px-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase text-gray-500 dark:text-gray-400">Unit Type</label>
                            <input type="text" id="new-prod-unit" value="Pcs" class="h-[44px] px-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50">
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase text-gray-500 dark:text-gray-400">Min Alert Lvl</label>
                            <input type="number" id="new-prod-reorder" value="5" class="h-[44px] px-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50">
                        </div>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold uppercase text-gray-500 dark:text-gray-400">Opening Stock Qty</label>
                        <input type="number" id="new-prod-qty" value="0" class="h-[44px] px-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold uppercase text-gray-500 dark:text-gray-400">Storage Location</label>
                        <input type="text" id="new-prod-location" value="WH-MAIN" class="h-[44px] px-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm uppercase outline-none focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50">
                    </div>
                </div>

                <div class="flex justify-end pt-4 mt-2 border-t border-gray-100 dark:border-gray-800">
                    <button type="submit" id="save-product-btn" class="bg-primary dark:bg-blue-600 text-white font-bold px-6 py-2.5 rounded-xl hover:bg-slate-800 dark:hover:bg-blue-500 transition-all shadow-md flex items-center gap-2">
                        <span class="material-symbols-outlined text-[18px]">save</span> Register Product
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuToggleBtn = document.getElementById('mobile-menu-toggle');
            const sideOverlay = document.getElementById('sidebar-overlay');
            const rootHtml = document.documentElement;

            const toggleSidebarState = () => { rootHtml.classList.toggle('sidebar-open'); };
            if (menuToggleBtn && sideOverlay) {
                menuToggleBtn.addEventListener('click', toggleSidebarState);
                sideOverlay.addEventListener('click', toggleSidebarState);
            }

            const themeToggleBtn = document.getElementById('theme-toggle');
            themeToggleBtn.addEventListener('click', () => {
                rootHtml.classList.toggle('dark');
                if (rootHtml.classList.contains('dark')) {
                    localStorage.setItem('theme', 'dark');
                    themeToggleBtn.innerText = 'dark_mode'; 
                } else {
                    localStorage.setItem('theme', 'light');
                    themeToggleBtn.innerText = 'light_mode'; 
                }
            });

            const setupDropdown = (btnId, menuId) => {
                const btn = document.getElementById(btnId);
                const menu = document.getElementById(menuId);
                if (!btn || !menu) return;

                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isOpen = !menu.classList.contains('opacity-0');
                    document.querySelectorAll('[id$="-dropdown"]').forEach(m => m.classList.add('opacity-0', 'invisible', 'translate-y-2'));
                    if (!isOpen) menu.classList.remove('opacity-0', 'invisible', 'translate-y-2');
                });
            };

            setupDropdown('notif-btn', 'notif-dropdown');
            setupDropdown('profile-btn', 'profile-dropdown');

            document.addEventListener('click', (e) => {
                const allMenus = document.querySelectorAll('[id$="-dropdown"]');
                allMenus.forEach(menu => {
                    if (!menu.contains(e.target) && !e.target.closest('button')) {
                        menu.classList.add('opacity-0', 'invisible', 'translate-y-2');
                    }
                });
            });
        });
    </script>
    <script type="module" src="./js/products.js"></script>
</body>
</html>
