<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Technocraft - New Challan</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        body { font-family: 'Hanken Grotesk', sans-serif; -webkit-font-smoothing: antialiased; }
        
        /* Smooth Entry Animations */
        @keyframes slideDownFade {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-down { animation: slideDownFade 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* Custom scrollbar for dropdowns */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
     <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#505f76", "inverse-primary": "#b7c8e1", "on-tertiary-fixed": "#2a1801",
                        "surface-variant": "#e4e2e4", "surface": "#fbf9fa", "on-tertiary-container": "#fff9f5",
                        "secondary-container": "#d2e1f7", "on-primary-container": "#f9f9ff", "on-primary-fixed": "#0b1c30",
                        "on-primary-fixed-variant": "#38485d", "surface-dim": "#dbd9db", "inverse-on-surface": "#f2f0f2",
                        "on-secondary-fixed-variant": "#39485a", "secondary-fixed": "#d4e4fa", "on-tertiary": "#ffffff",
                        "secondary": "#516072", "tertiary-container": "#8a6e4c", "surface-bright": "#fbf9fa",
                        "secondary-fixed-dim": "#b9c8de", "on-surface-variant": "#44474c", "on-background": "#1b1b1d",
                        "on-secondary-container": "#556477", "surface-container-lowest": "#ffffff", "inverse-surface": "#303032",
                        "on-error-container": "#93000a", "on-tertiary-fixed-variant": "#5a4224", "primary-fixed-dim": "#b7c8e1",
                        "tertiary-fixed-dim": "#e3c199", "primary-container": "#64748b", "error-container": "#ffdad6",
                        "on-surface": "#1b1b1d", "primary-fixed": "#d3e4fe", "surface-container-low": "#f5f3f5",
                        "on-primary": "#ffffff", "outline": "#74777d", "on-secondary": "#ffffff", "outline-variant": "#c4c6cd",
                        "tertiary": "#6f5636", "on-error": "#ffffff", "on-secondary-fixed": "#0d1c2d",
                        "surface-container-highest": "#e4e2e4", "error": "#ba1a1a", "background": "#f4f5f7",
                        "tertiary-fixed": "#ffddb6", "primary": "#4c5b71", "surface-container": "#efedef"
                    },
                    "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                    "spacing": { "margin-mobile": "16px", "lg": "2rem", "base": "4px", "md": "1.5rem", "gutter": "24px", "margin-desktop": "32px", "xs": "0.5rem", "xl": "3rem", "sm": "1rem" },
                    "fontFamily": {
                        "label-md": ["Hanken Grotesk"], "code-sm": ["jetbrainsMono"], "body-md": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"], "body-lg": ["Hanken Grotesk"], "headline-lg": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                        "code-sm": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#fbf9fa] text-[#1b1b1d]">

    <div id="sidebar-container"></div>

    <header class="h-16 sticky top-0 z-40 ml-[280px] bg-[#fbf9fa]/90 backdrop-blur-md flex justify-between items-center px-8 w-[calc(100%-280px)] shadow-sm border-b border-gray-100 transition-all">
        <h2 class="text-xl font-bold text-[#1b1b1d]">Create New Entry</h2>
    </header>

    <main class="ml-[280px] p-4 md:p-8 min-h-screen">
        <form id="challanForm" class="bg-white p-6 md:p-8 rounded-[1.5rem] shadow-[0_5px_20px_rgba(0,0,0,0.02)] border border-gray-100 flex flex-col gap-8 max-w-5xl mx-auto">
            
            <div>
                <h3 class="text-sm font-bold text-[#4c5b71] mb-5 border-b border-gray-100 pb-2 uppercase tracking-wider">1. Transaction Context</h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-5 items-start">
                    
                    <div class="flex flex-col gap-1.5 relative" id="type-dropdown-container">
                        <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wide">Operation Type <span class="text-error">*</span></label>
                        <input type="hidden" id="type" name="type" value="Out" required>
                        <button type="button" id="type-btn" class="w-full flex justify-between items-center bg-blue-50 border border-blue-100 text-blue-800 hover:bg-blue-100 font-bold rounded-xl px-4 py-2.5 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-200 shadow-sm text-sm">
                            <span id="type-label">OUT (Dispatch / Sale)</span>
                            <span class="material-symbols-outlined text-[18px]">expand_more</span>
                        </button>
                        <div id="type-menu" class="absolute top-[70px] left-0 w-full bg-white border border-gray-100 rounded-xl shadow-lg opacity-0 invisible translate-y-2 transition-all duration-200 z-20 py-1 overflow-hidden">
                            <button type="button" class="type-option w-full text-left px-4 py-2.5 text-sm font-bold text-blue-800 bg-blue-50/50 hover:bg-blue-50 transition-colors border-l-2 border-blue-500" data-value="Out" data-color="blue">OUT (Dispatch / Sale)</button>
                            <button type="button" class="type-option w-full text-left px-4 py-2.5 text-sm font-bold text-gray-600 hover:bg-emerald-50 hover:text-emerald-800 transition-colors border-l-2 border-transparent hover:border-emerald-500" data-value="In" data-color="emerald">IN (Receive / Purchase)</button>
                        </div>
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wide">Challan Number <span class="text-error">*</span></label>
                        <input type="text" id="challan_number" required class="border-gray-200 bg-white rounded-xl focus:ring-[#4c5b71] focus:border-[#4c5b71] text-sm py-2.5 shadow-sm font-mono placeholder-gray-300 transition-all" placeholder="Enter Challan ID">
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wide">Order ID <span class="text-error">*</span></label>
                        <input type="text" id="order_id" required class="border-gray-200 bg-white rounded-xl focus:ring-[#4c5b71] focus:border-[#4c5b71] text-sm py-2.5 shadow-sm font-mono placeholder-gray-300 transition-all" placeholder="Enter Order Ref">
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold text-gray-500 uppercase tracking-wide">Issue Date <span class="text-error">*</span></label>
                        <input type="date" id="date" required class="border-gray-200 rounded-xl focus:ring-[#4c5b71] focus:border-[#4c5b71] text-sm py-2.5 shadow-sm cursor-pointer transition-all">
                    </div>
                </div>
            </div>

            <div>
                <h3 id="party-section-title" class="text-sm font-bold text-[#4c5b71] mb-5 border-b border-gray-100 pb-2 uppercase tracking-wider transition-colors duration-300">2. Customer Details</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5" id="entity-section">
                    
                    <div class="flex flex-col gap-4">
                        <div class="flex flex-col gap-1.5">
                            <label id="party-name-label" class="text-[11px] font-bold text-gray-500 uppercase">Customer / Business Name <span class="text-error">*</span></label>
                            <input type="text" id="party_name" required class="border-gray-200 rounded-xl focus:ring-[#4c5b71] focus:border-[#4c5b71] text-sm shadow-sm transition-all" placeholder="Apex Retailers Ltd.">
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold text-gray-500 uppercase">GST Number <span class="text-error">*</span></label>
                            <input type="text" id="party_gst" required pattern="^[0-9]{2}[A-Z0-9]{13}$" class="border-gray-200 rounded-xl focus:ring-[#4c5b71] focus:border-[#4c5b71] text-sm shadow-sm font-mono uppercase transition-all" placeholder="22AAAAA0000A1Z5" title="Please enter a valid 15-character GSTIN">
                        </div>
                    </div>

                    <div class="flex flex-col gap-4">
                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold text-gray-500 uppercase flex justify-between items-center">
                                <span>Phone Number(s) <span class="text-error">*</span></span>
                            </label>
                            <div id="phone-container" class="flex flex-col gap-2">
                                <div class="flex items-center gap-2 group">
                                    <input type="tel" required pattern="[0-9+\- ]{10,15}" class="party-phone border-gray-200 rounded-xl focus:ring-[#4c5b71] focus:border-[#4c5b71] text-sm shadow-sm transition-all flex-grow" placeholder="+91 9876543210">
                                    <button type="button" class="add-phone-btn w-9 h-9 shrink-0 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center hover:bg-blue-100 transition-colors shadow-sm" title="Add another number">
                                        <span class="material-symbols-outlined text-[18px]">add</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold text-gray-500 uppercase">Email Address(es)</label>
                            <div id="email-container" class="flex flex-col gap-2">
                                <div class="flex items-center gap-2 group">
                                    <input type="email" class="party-email border-gray-200 rounded-xl focus:ring-[#4c5b71] focus:border-[#4c5b71] text-sm shadow-sm transition-all flex-grow" placeholder="contact@entity.com">
                                    <button type="button" class="add-email-btn w-9 h-9 shrink-0 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center hover:bg-blue-100 transition-colors shadow-sm" title="Add another email">
                                        <span class="material-symbols-outlined text-[18px]">add</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <div class="flex justify-between items-end mb-4 border-b border-gray-100 pb-2">
                    <h3 class="text-sm font-bold text-[#4c5b71] uppercase tracking-wider">3. Inventory Logs</h3>
                    <button type="button" id="addRowBtn" class="bg-[#d3e4fe] text-[#0b1c30] px-4 py-2 rounded-xl text-xs font-bold hover:bg-[#b7c8e1] transition-all shadow-sm flex items-center gap-1 active:scale-95">
                        <span class="material-symbols-outlined text-[16px]">add</span> Add Row
                    </button>
                </div>
                
                <div class="overflow-x-auto border border-gray-100 rounded-[1.25rem] shadow-sm">
                    <table class="w-full text-left border-collapse bg-white" id="itemsTable">
                        <thead>
                            <tr class="bg-gray-50 text-[10px] text-gray-500 uppercase tracking-wider border-b border-gray-100">
                                <th class="p-4 w-2/5 font-bold">Item Name / SKU <span class="text-error">*</span></th>
                                <th class="p-4 w-1/5 font-bold">Quantity <span class="text-error">*</span></th>
                                <th class="p-4 w-1/5 font-bold">Packaging Unit</th>
                                <th class="p-4 w-1/6 font-bold">Base Rate (₹)</th>
                                <th class="p-4 w-12 text-center font-bold">Action</th>
                            </tr>
                        </thead>
                        <tbody id="itemsBody" class="divide-y divide-gray-50">
                            </tbody>
                    </table>
                </div>
            </div>

            <div class="flex justify-end pt-6 border-t border-gray-100 gap-3 mt-2">
                <button type="button" onclick="window.history.back()" class="px-6 py-2.5 rounded-xl text-sm font-bold text-gray-500 hover:bg-gray-100 border border-transparent transition-all">Cancel</button>
                <button type="submit" id="submitBtn" class="bg-[#4c5b71] text-white px-8 py-2.5 rounded-xl font-bold shadow-md hover:bg-[#38485d] hover:shadow-lg transition-all active:scale-95 text-sm flex items-center gap-2">
                    <span class="material-symbols-outlined text-[18px]">save</span> Post Transaction
                </button>
            </div>
        </form>
    </main>

    <script type="module" src="./js/newentry.js"></script>
</body>
</html>
