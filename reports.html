<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Reports & Audits Engine | Technocraft</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Hanken Grotesk', sans-serif; -webkit-font-smoothing: antialiased; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
        .monospace { font-family: 'JetBrains Mono', 'Courier New', monospace; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e4e2e4; border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; }

        @media (max-width: 1023px) {
            .sidebar-open #sidebar-wrapper { transform: translateX(0); }
            .sidebar-open #sidebar-overlay { opacity: 1; visibility: visible; }
        }

        /* Print Engine Styles */
        @media print {
            @page { margin: 1cm; size: landscape; }
            body, html { background: white !important; color: black !important; }
            #sidebar-wrapper, header, #report-config-section, .print-hidden { display: none !important; }
            main { margin: 0 !important; padding: 0 !important; width: 100% !important; }
            .shadow-sm, .shadow-md, .shadow-lg { box-shadow: none !important; }
            .border { border-color: #e5e7eb !important; }
            table { width: 100% !important; font-size: 10px !important; }
            th { background-color: #f3f4f6 !important; color: black !important; font-size: 11px !important; border-bottom: 2px solid #d1d5db !important; }
            td { color: black !important; border-bottom: 1px solid #e5e7eb !important; }
        }
    </style>

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: { primary: "#4c5b71" } } }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-[#0f0f11] text-gray-900 dark:text-gray-100 font-sans overflow-x-hidden flex transition-colors duration-300">

    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm opacity-0 invisible transition-all duration-300 z-40 lg:hidden"></div>
    <div id="sidebar-wrapper" class="fixed top-0 bottom-0 left-0 w-[280px] h-screen bg-white dark:bg-[#1a1a1e] z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out border-r border-gray-200/50 dark:border-gray-800 shadow-2xl lg:shadow-none">
        <div id="sidebar-container" class="h-full w-full"></div>
    </div>

    <main class="flex-1 min-w-0 ml-0 lg:ml-[280px] h-screen overflow-y-auto relative transition-all duration-300 w-full custom-scrollbar bg-[#f1f3f6] dark:bg-[#0f0f11]">
        
        <header class="h-16 sticky top-0 z-40 bg-white/90 dark:bg-[#0f0f11]/90 backdrop-blur-md flex items-center justify-between px-4 lg:px-8 border-b border-gray-200/60 dark:border-gray-800 transition-all">
            
            <div class="flex items-center gap-2 md:gap-3 shrink-0 z-10 w-[60%] sm:w-auto">
                <button id="mobile-menu-toggle" class="material-symbols-outlined text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-blue-400 p-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full lg:hidden transition-colors cursor-pointer focus:outline-none shrink-0">
                    menu
                </button>
                <h2 class="font-headline-md text-base md:text-lg lg:text-xl font-bold text-gray-900 dark:text-gray-50 whitespace-nowrap truncate">
                    Reports & Audits
                </h2>
            </div>
            
            <div class="relative flex items-center justify-end flex-grow h-full gap-1 sm:gap-2 lg:gap-4 z-40">
                
                <div class="group flex items-center justify-end z-50 transition-all duration-300 ease-in-out w-10 h-10 md:w-[240px] focus-within:absolute focus-within:right-0 focus-within:w-[calc(100vw-80px)] sm:focus-within:w-[calc(100vw-120px)] md:focus-within:relative md:focus-within:w-[320px] lg:focus-within:w-[450px]">
                    <div class="w-full h-full rounded-full bg-transparent hover:bg-gray-100 dark:hover:bg-gray-800 md:bg-gray-100 md:dark:bg-[#1a1a1e] group-focus-within:bg-white dark:group-focus-within:bg-[#1a1a1e] border border-transparent group-focus-within:border-primary dark:group-focus-within:border-blue-500 group-focus-within:ring-2 group-focus-within:ring-primary/20 dark:group-focus-within:ring-blue-500/20 transition-all duration-300 flex items-center relative overflow-hidden shadow-none group-focus-within:shadow-md md:group-focus-within:shadow-none">
                        <label for="headerSearchInput" class="material-symbols-outlined flex-shrink-0 ml-2 md:ml-3 text-gray-500 dark:text-gray-400 group-focus-within:text-primary dark:group-focus-within:text-blue-500 cursor-pointer text-[20px] p-1">search</label>
                        <input id="headerSearchInput" type="text" placeholder="Search current report..." class="w-full h-full bg-transparent border-none outline-none pl-2 pr-10 text-sm text-gray-900 dark:text-gray-100 placeholder-transparent md:placeholder-gray-500 dark:md:placeholder-gray-400 group-focus-within:placeholder-gray-500 dark:group-focus-within:placeholder-gray-400 cursor-pointer md:cursor-text group-focus-within:cursor-text opacity-0 group-focus-within:opacity-100 md:opacity-100 transition-opacity">
                        <button type="button" onclick="document.getElementById('headerSearchInput').blur(); document.getElementById('headerSearchInput').value=''; document.getElementById('headerSearchInput').dispatchEvent(new Event('input'));" class="material-symbols-outlined absolute right-2 text-gray-400 hover:text-red-500 dark:hover:text-red-400 text-[18px] opacity-0 invisible group-focus-within:opacity-100 group-focus-within:visible transition-all cursor-pointer p-1">close</button>
                    </div>
                </div>

                <div class="h-6 w-px bg-gray-200 dark:bg-gray-700 hidden lg:block shrink-0"></div>

                <div class="flex items-center gap-1 sm:gap-2 shrink-0 transition-opacity duration-200">
                    <button class="material-symbols-outlined text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-blue-400 hover:bg-gray-100 dark:hover:bg-gray-800 p-1.5 rounded-full transition-all cursor-pointer hidden lg:flex items-center justify-center">help_outline</button>
                    
                    <div class="relative flex items-center shrink-0">
                        <button id="notif-btn" class="material-symbols-outlined text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-blue-400 p-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full transition-all cursor-pointer relative flex items-center justify-center">
                            notifications
                            <span class="absolute top-[4px] right-[4px] w-2 h-2 bg-[#e2726e] rounded-full border-[1.5px] border-white dark:border-[#0f0f11]"></span>
                        </button>
                        <div id="notif-dropdown" class="absolute right-0 mt-3 top-full w-64 sm:w-72 bg-white dark:bg-[#1a1a1e] border border-gray-200 dark:border-gray-800 rounded-xl shadow-lg opacity-0 invisible translate-y-2 transition-all duration-300 z-50">
                            <div class="p-4 border-b border-gray-100 dark:border-gray-800 font-bold text-gray-900 dark:text-gray-100 flex justify-between items-center text-sm">
                                Notifications <span class="text-[10px] bg-primary/10 dark:bg-blue-500/20 text-primary dark:text-blue-400 px-2 py-0.5 rounded-full">1 New</span>
                            </div>
                            <div class="p-3 flex flex-col">
                                <div class="flex gap-3 items-start cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800/50 p-2 rounded-lg transition-colors">
                                    <div class="w-8 h-8 rounded-full bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400 flex items-center justify-center shrink-0">
                                        <span class="material-symbols-outlined text-[16px]">check_circle</span>
                                    </div>
                                    <div>
                                        <p class="text-sm font-semibold text-gray-900 dark:text-gray-200">System Update Complete</p>
                                        <p class="text-xs text-gray-500 dark:text-gray-400">v2.0 is live.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="relative flex items-center shrink-0">
                        <button id="theme-toggle" class="material-symbols-outlined text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-blue-400 hover:bg-gray-100 dark:hover:bg-gray-800 p-1.5 rounded-full transition-all cursor-pointer flex items-center justify-center">
                            light_mode
                        </button>
                    </div>

                    <div class="relative flex items-center shrink-0 ml-1">
                        <button id="profile-btn" class="h-8 w-8 md:h-9 md:w-9 rounded-full bg-blue-50 dark:bg-blue-900/30 flex items-center justify-center overflow-hidden border border-gray-200 dark:border-gray-700 hover:border-primary dark:hover:border-blue-400 transition-all focus:outline-none shrink-0">
                            <img alt="Manager Avatar" class="h-full w-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAUVVNY6j7Epofems6gnzxGIqPtIh7L84Mmo2KGXgI5pN0ay7N8KorHhNDtLcDkJ_hrg53GGHYD1aS1pALgQgn-w0LUV1FmN3pByIwaoYndPJXYMIj6cf7dZACPDDXsIeMfYYvc4W_E-j0pjYoOyrO1oOeHak_6uJx-OHMA-ssh-4VCl8pSX9UbpFbFfssOrrZZGYVf97CyFHckA-VLQPWUWsAEzzyMNUoZcJ506_N8pATIjH9JvPHN1jMkkgPhooG7Y7YgJ5CUdymp"/>
                        </button>
                        <div id="profile-dropdown" class="absolute right-0 mt-3 top-full w-48 bg-white dark:bg-[#1a1a1e] border border-gray-200 dark:border-gray-800 rounded-xl shadow-lg opacity-0 invisible translate-y-2 transition-all duration-300 z-50 py-1">
                            <div class="px-4 py-2 border-b border-gray-100 dark:border-gray-800 mb-1">
                                <p class="font-bold text-sm text-gray-900 dark:text-gray-100">Operations Admin</p>
                            </div>
                            <a href="#" class="flex items-center gap-2 px-4 py-2 text-sm text-red-500 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-500/10 transition-colors">
                                <span class="material-symbols-outlined text-[18px]">logout</span> Sign out
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="p-4 md:p-6 lg:p-8 max-w-[1600px] mx-auto w-full flex flex-col gap-6 lg:gap-8">
            
            <section id="report-config-section" class="bg-white dark:bg-[#1a1a1e] border border-gray-200 dark:border-gray-800 p-5 md:p-6 rounded-[1.5rem] shadow-sm transition-colors">
                <h3 class="text-sm font-bold text-gray-800 dark:text-gray-200 mb-4 tracking-tight">Report Configuration Parameters</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-4 md:gap-5 items-end">
                    
                    <div class="flex flex-col gap-1.5 md:col-span-2">
                        <label class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Report Type</label>
                        <select id="report-config-select" class="w-full h-[46px] px-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50 outline-none transition-colors cursor-pointer">
                            <option value="aging">Accounts Receivable (Aging & Dues)</option>
                            <option value="ledger">Party-Wise Account Ledger</option>
                            <option value="logistics">Logistics & Dispatch Tracker</option>
                            <option value="tax">GST / Tax Compliance (HSN Summary)</option>
                            <option value="sales">Sales & Outbound Summary</option>
                            <option value="purchase">Purchase & Inbound Summary</option>
                        </select>
                    </div>

                    
                    

                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Date Range (Start)</label>
                        <input id="report-start-date" type="date" style="color-scheme: light dark;" class="w-full h-[46px] px-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50 outline-none transition-colors">
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Date Range (End)</label>
                        <input id="report-end-date" type="date" style="color-scheme: light dark;" class="w-full h-[46px] px-4 bg-gray-50 dark:bg-[#0f0f11] border border-gray-200 dark:border-gray-800 text-gray-900 dark:text-gray-100 rounded-xl text-sm focus:ring-2 focus:ring-primary dark:focus:ring-blue-500/50 outline-none transition-colors">
                    </div>
                </div>

                <div class="mt-5 flex justify-end">
                    <button id="compile-btn" class="w-full sm:w-auto bg-primary dark:bg-blue-600 text-white px-8 py-3 rounded-xl shadow-md hover:bg-slate-800 dark:hover:bg-blue-500 transition-all font-bold text-sm flex items-center justify-center gap-2 active:scale-95">
                        <span class="material-symbols-outlined text-[18px]">analytics</span> <span id="compile-btn-text">Generate Report</span>
                    </button>
                </div>
            </section>

            <section class="bg-white dark:bg-[#1a1a1e] border border-gray-200 dark:border-gray-800 rounded-[1.5rem] shadow-sm overflow-hidden flex flex-col transition-colors">
                
                <div class="px-5 md:px-8 py-5 md:py-6 border-b border-gray-200 dark:border-gray-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-gray-50 dark:bg-[#222226] transition-colors">
                    <div>
                        <h3 id="active-ledger-title" class="text-lg md:text-xl font-bold text-gray-900 dark:text-gray-100">Audit Ledger: Comprehensive View</h3>
                        <p id="active-ledger-period" class="text-xs text-gray-500 dark:text-gray-400 mt-1 uppercase tracking-widest font-bold">Awaiting Execution</p>
                    </div>
                    <div class="flex gap-2 sm:gap-3 w-full sm:w-auto print-hidden">
                        <button onclick="window.print()" class="flex-1 sm:flex-none flex justify-center items-center gap-2 border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#1a1a1e] px-4 py-2 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors text-xs font-bold text-gray-600 dark:text-gray-300 shadow-sm dark:shadow-none">
                            <span class="material-symbols-outlined text-[18px]">print</span> Print
                        </button>
                        <button id="export-csv-btn" class="flex-1 sm:flex-none flex justify-center items-center gap-2 border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#1a1a1e] px-4 py-2 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors text-xs font-bold text-gray-600 dark:text-gray-300 shadow-sm dark:shadow-none">
                            <span class="material-symbols-outlined text-[18px]">download</span> CSV
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto w-full custom-scrollbar" style="-webkit-overflow-scrolling: touch;">
                    <table class="w-full text-left border-collapse min-w-[800px]" id="dynamic-report-table">
                        <thead id="ledger-table-head" class="bg-gray-50 dark:bg-[#222226] border-b border-gray-200 dark:border-gray-800 transition-colors">
                            </thead>
                        <tbody id="ledger-table-body" class="divide-y divide-gray-100 dark:divide-gray-800/50 text-sm">
                            <tr>
                                <td colspan="10" class="px-6 py-12 text-center text-gray-500 dark:text-gray-400 font-medium">
                                    Configure parameters above and click "Generate Report".
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="px-6 py-4 border-t border-gray-200 dark:border-gray-800 flex justify-between items-center bg-gray-50 dark:bg-[#222226] transition-colors">
                    <p id="ledger-count-string" class="text-xs font-semibold text-gray-500 dark:text-gray-400">System Ready.</p>
                </div>
            </section>

        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuToggleBtn = document.getElementById('mobile-menu-toggle');
            const sideOverlay = document.getElementById('sidebar-overlay');
            const rootHtml = document.documentElement;

            const toggleSidebarState = () => rootHtml.classList.toggle('sidebar-open');

            if (menuToggleBtn && sideOverlay) {
                menuToggleBtn.addEventListener('click', toggleSidebarState);
                sideOverlay.addEventListener('click', toggleSidebarState);
            }

            const themeToggleBtn = document.getElementById('theme-toggle');
            themeToggleBtn.addEventListener('click', () => {
                rootHtml.classList.toggle('dark');
                if (rootHtml.classList.contains('dark')) {
                    localStorage.setItem('theme', 'dark');
                    themeToggleBtn.innerText = 'dark_mode'; 
                } else {
                    localStorage.setItem('theme', 'light');
                    themeToggleBtn.innerText = 'light_mode'; 
                }
                window.dispatchEvent(new Event('themeChanged'));
            });

            // Universal Dropdown Controller
            const setupDropdown = (btnId, menuId) => {
                const btn = document.getElementById(btnId);
                const menu = document.getElementById(menuId);
                if (!btn || !menu) return;

                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isOpen = !menu.classList.contains('opacity-0');
                    document.querySelectorAll('[id$="-dropdown"]').forEach(m => m.classList.add('opacity-0', 'invisible', 'translate-y-2'));
                    if (!isOpen) menu.classList.remove('opacity-0', 'invisible', 'translate-y-2');
                });
            };

            setupDropdown('notif-btn', 'notif-dropdown');
            setupDropdown('profile-btn', 'profile-dropdown');

            document.addEventListener('click', (e) => {
                const allMenus = document.querySelectorAll('[id$="-dropdown"]');
                allMenus.forEach(menu => {
                    if (!menu.contains(e.target) && !e.target.closest('button')) {
                        menu.classList.add('opacity-0', 'invisible', 'translate-y-2');
                    }
                });
            });
        });
    </script>
    <script type="module" src="./js/reports.js"></script>
</body>
</html>
